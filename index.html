<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NAGeo — Hub</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/manifest.json">
<meta name="theme-color" content="#0f2341">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NAGeo Hub">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#060d1a;--navy2:#0d1f38;--navy3:#123055;
  --green:#43a047;--green-light:#8fe396;--green-deep:#1b6b2e;
  --text:#f4f7fc;--text-dim:rgba(244,247,252,.58);--text-dimmer:rgba(244,247,252,.34);
  --glass:rgba(255,255,255,.045);--glass-border:rgba(255,255,255,.08);--glass-hover:rgba(255,255,255,.075);
  --radius:18px;
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse 900px 500px at 12% -8%, rgba(67,160,71,.16), transparent 55%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(18,48,85,.5), transparent 60%),
    radial-gradient(ellipse 800px 600px at 50% 120%, rgba(27,107,46,.1), transparent 60%),
    linear-gradient(175deg,var(--navy) 0%,#081527 45%,var(--navy) 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* faint dot-grid texture for depth */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%);
}
/* subtle ambient orbs, green only, slow drift */
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
.orb1{width:480px;height:480px;background:var(--green-deep);top:-160px;right:-140px;opacity:.22;animation:drift1 22s ease-in-out infinite;}
.orb2{width:380px;height:380px;background:var(--navy3);bottom:-180px;left:-120px;opacity:.5;animation:drift2 26s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(-24px,28px);}}
@keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(26px,-20px);}}
@media (prefers-reduced-motion:reduce){.orb{animation:none;}}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:3rem 2rem 4rem;}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;margin-bottom:2.8rem;flex-wrap:wrap;
  animation:fadeUp .5s ease both;}
.brand{display:flex;align-items:center;gap:13px;}
.brand-badge{width:44px;height:44px;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);flex-shrink:0;}
.brand-badge img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-name{font-size:12.5px;font-weight:700;color:var(--text-dimmer);letter-spacing:1.2px;text-transform:uppercase;}
.greeting{font-size:33px;font-weight:700;letter-spacing:-.6px;margin-top:3px;}
.greeting span{background:linear-gradient(90deg,#fff,var(--green-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.clock{text-align:right;color:var(--text-dimmer);font-size:12.5px;}
.clock .time{font-size:21px;font-weight:600;color:var(--text-dim);font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* search */
.search-row{margin-bottom:2rem;position:relative;max-width:400px;
  animation:fadeUp .5s ease .05s both;}
.search-row input{
  width:100%;padding:12px 16px 12px 40px;border-radius:12px;
  border:1px solid var(--glass-border);background:var(--glass);
  color:var(--text);font-size:13.5px;font-family:inherit;backdrop-filter:blur(14px);
  transition:all .15s;
}
.search-row input::placeholder{color:var(--text-dimmer);}
.search-row input:focus{outline:none;border-color:rgba(67,160,71,.55);background:rgba(67,160,71,.06);box-shadow:0 0 0 3px rgba(67,160,71,.1);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4;font-size:13px;pointer-events:none;}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;}
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(155deg, var(--glass), rgba(255,255,255,.02));
  border:1px solid var(--glass-border);border-radius:var(--radius);
  padding:20px 20px 18px;backdrop-filter:blur(18px);
  text-decoration:none;color:inherit;display:block;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), background .25s, border-color .25s, box-shadow .25s;
  cursor:pointer;
  animation:fadeUp .5s ease both;
}
.card::after{
  content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
}
.card:hover{
  transform:translateY(-5px);
  background:linear-gradient(155deg, var(--glass-hover), rgba(255,255,255,.03));
  border-color:rgba(143,227,150,.28);
  box-shadow:0 22px 44px rgba(0,0,0,.4), 0 0 0 1px rgba(67,160,71,.08), 0 0 30px rgba(67,160,71,.06);
}
.card::before{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,0%), rgba(143,227,150,.09), transparent 60%);
  pointer-events:none;
}
.card:hover::before{opacity:1;}
.card-icon{
  width:52px;height:52px;border-radius:13px;overflow:hidden;
  margin-bottom:15px;box-shadow:0 8px 18px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);
  transition:transform .25s;
}
.card:hover .card-icon{transform:scale(1.04);}
.card-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.card-title{font-size:15.5px;font-weight:700;margin-bottom:5px;letter-spacing:-.2px;}
.card-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:15px;min-height:36px;}
.card-foot{display:flex;align-items:center;justify-content:space-between;}
.card-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:4px 9px;border-radius:20px;background:rgba(67,160,71,.14);color:var(--green-light);border:1px solid rgba(67,160,71,.18);}
.card-arrow{font-size:15px;color:var(--text-dimmer);transition:transform .2s, color .2s;}
.card:hover .card-arrow{transform:translateX(3px);color:var(--green-light);}

/* footer */
.footer{margin-top:2.6rem;text-align:center;color:var(--text-dimmer);font-size:11.5px;letter-spacing:.2px;}
.footer a{color:var(--text-dim);text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.2);}
.footer a:hover{color:var(--green-light);border-color:rgba(143,227,150,.4);}

/* schedule strip */
.sched{margin-top:2.8rem;animation:fadeUp .5s ease .1s both;}
.sched-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.sched-title{font-size:18px;font-weight:700;letter-spacing:-.3px;flex:1;}
.sched-range{font-size:12.5px;color:var(--text-dimmer);}
.sched-nav{display:flex;gap:6px;}
.sched-nav button{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--glass-border);background:var(--glass);
  color:var(--text-dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-family:inherit;
}
.sched-nav button:hover{background:rgba(67,160,71,.14);border-color:rgba(67,160,71,.35);color:var(--green-light);}
.sched-today-btn{
  font-size:11.5px;font-weight:600;padding:0 12px;border-radius:9px;border:1px solid var(--glass-border);
  background:var(--glass);color:var(--text-dim);cursor:pointer;font-family:inherit;transition:all .15s;
}
.sched-today-btn:hover{background:rgba(67,160,71,.14);border-color:rgba(67,160,71,.35);color:var(--green-light);}
.sched-tv-btn{
  font-size:12px;font-weight:700;padding:7px 14px;border-radius:9px;border:1px solid rgba(67,160,71,.3);
  background:rgba(67,160,71,.12);color:var(--green-light);cursor:pointer;font-family:inherit;transition:all .15s;
}
.sched-tv-btn:hover{background:rgba(67,160,71,.22);border-color:rgba(67,160,71,.5);}
.sched-state{font-size:12.5px;color:var(--text-dimmer);padding:1.5rem;text-align:center;}
.sched-state a{color:var(--green-light);}

.sched-view-toggle{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:10px;padding:3px;gap:2px;}
.sched-view-btn{border:none;background:transparent;color:var(--text-dimmer);font-size:12px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s;}
.sched-view-btn.active{background:rgba(67,160,71,.18);color:var(--green-light);}
.sched-view-btn:hover:not(.active){color:var(--text-dim);}

/* overview grid — the original 7-day-at-a-glance view, toggled alongside the live carousel */
.sched-strip{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;
}
.sched-strip::-webkit-scrollbar{height:6px;}
.sched-strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px;}
.sched-day{
  scroll-snap-align:start;flex:0 0 240px;min-height:120px;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;
  padding:14px;backdrop-filter:blur(14px);
}
.sched-day.is-today{border-color:rgba(143,227,150,.4);background:rgba(67,160,71,.07);box-shadow:0 0 0 1px rgba(67,160,71,.12);}
.sched-day-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.sched-day-name{font-size:12.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.sched-day.is-today .sched-day-name{color:var(--green-light);}
.sched-day-date{font-size:11px;color:var(--text-dimmer);}
.sched-day-count{font-size:10px;color:var(--text-dimmer);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:10px;}
.sched-job{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;
  padding:9px 10px;margin-bottom:7px;cursor:pointer;transition:background .15s,border-color .15s;
}
.sched-job:last-child{margin-bottom:0;}
.sched-job:hover{background:rgba(67,160,71,.1);border-color:rgba(67,160,71,.25);}
.sched-job-time-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px;}
.sched-job-time{font-size:11px;font-weight:700;color:var(--green-light);}
.sched-job-id{font-size:9.5px;color:var(--text-dimmer);font-family:'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;flex-shrink:0;}
.sched-job-cust{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:2px;line-height:1.3;}
.sched-job-tech{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
.sched-job-detail{
  display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11.5px;color:var(--text-dim);line-height:1.5;
}
.sched-job.open .sched-job-detail{display:block;}
.sched-empty{font-size:11.5px;color:var(--text-dimmer);text-align:center;padding:1.4rem 0;}
@media(max-width:600px){
  .sched-day{flex-basis:78vw;}
}

/* mini live carousel — same slide engine as TV Mode, scaled down and inline.
   Reuses the .tv-* slide classes (defined below) via the .mini-tv scope so
   both sizes render identical markup and never drift out of sync. */
.mini-tv{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:18px;
  padding:16px 18px 14px;backdrop-filter:blur(16px);
}
.mini-slide-wrap{display:flex;flex-direction:column;height:270px;}
.mini-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;}
.mini-ctrl-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--glass-border);background:var(--glass);
  color:var(--text-dim);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-family:inherit;
}
.mini-ctrl-btn:hover{background:rgba(67,160,71,.18);border-color:rgba(67,160,71,.4);color:var(--green-light);}
.mini-ctrl-btn.primary{background:rgba(67,160,71,.16);border-color:rgba(67,160,71,.35);color:var(--green-light);}
.mini-tv .tv-slide-hdr{margin-bottom:10px;}
.mini-tv .tv-slide-day{font-size:10.5px;letter-spacing:1.3px;margin-bottom:4px;}
.mini-tv .tv-slide-tech{font-size:19px;gap:10px;}
.mini-tv .tv-slide-tech-avatar{width:32px;height:32px;font-size:12px;border-radius:9px;}
.mini-tv .tv-slide-count{font-size:11.5px;margin-left:2px;}
.mini-tv .tv-body{gap:14px;}
.mini-tv .tv-job-card{padding:11px 13px;border-radius:12px;border-left-width:3px;}
.mini-tv .tv-job-time{font-size:12.5px;margin-bottom:2px;}
.mini-tv .tv-job-cust{font-size:13.5px;margin-bottom:2px;}
.mini-tv .tv-job-addr{font-size:11px;margin-bottom:4px;}
.mini-tv .tv-job-type{font-size:9px;padding:2px 7px;}
.mini-tv .tv-job-id{font-size:9px;padding:2px 7px;}
.mini-tv .tv-job-notes{font-size:11px;margin-top:5px;}
.mini-tv .tv-map{border-radius:13px;}
.mini-tv .tv-empty-day-icon{font-size:32px;}
.mini-tv .tv-empty-day-text{font-size:12.5px;}
.mini-tv .tv-progress{padding:0 0 10px;position:static;}
.mini-tv .tv-dot{height:3px;}
.mini-tv .tv-lead-body{gap:10px;}
.mini-tv .ld-slide-overview{font-size:12.5px;padding:11px 13px;border-radius:12px;}
.mini-tv .ld-slide-email{padding:10px 13px;border-radius:12px;}
.mini-tv .ld-slide-email-meta{font-size:10px;margin-bottom:4px;}
.mini-tv .ld-slide-email-body{font-size:12px;}
@media(max-width:700px){
  .mini-slide-wrap{height:auto;}
  .mini-tv .tv-body{grid-template-columns:1fr;}
  .mini-tv .tv-map{min-height:160px;}
}

/* ── TV MODE: full-screen auto-advancing wallboard ── */
.tv{position:fixed;inset:0;z-index:100;background:var(--navy);display:none;flex-direction:column;overflow:hidden;}
.tv.open{display:flex;}
.tv-bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 1000px 600px at 15% 0%, rgba(67,160,71,.14), transparent 55%),
    radial-gradient(ellipse 900px 700px at 100% 100%, rgba(18,48,85,.5), transparent 60%),
    linear-gradient(175deg,var(--navy) 0%,#081527 50%,var(--navy) 100%);
}
.tv-top{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:22px 40px 10px;flex-shrink:0;}
.tv-top-badge{width:42px;height:42px;border-radius:11px;overflow:hidden;flex-shrink:0;}
.tv-top-badge img{width:100%;height:100%;object-fit:cover;display:block;}
.tv-top-day{
  font-size:28px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--navy);background:var(--green-light);padding:7px 20px;border-radius:12px;
  box-shadow:0 6px 20px rgba(67,160,71,.3);flex-shrink:0;
}
.tv-top-title{font-size:13px;font-weight:700;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:1.5px;}
.tv-top-clock{margin-left:auto;font-size:20px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
.tv-exit{
  margin-left:16px;width:38px;height:38px;border-radius:10px;border:1px solid var(--glass-border);
  background:var(--glass);color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:all .15s;
}
.tv-exit:hover{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.4);color:#fca5a5;}

.tv-slide-wrap{position:relative;z-index:1;flex:1;min-height:0;padding:10px 40px 30px;display:flex;flex-direction:column;}
.tv-slide-hdr{margin-bottom:20px;}
.tv-slide-day{
  display:inline-block;font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--navy);background:var(--green-light);padding:9px 24px;border-radius:14px;
  margin-bottom:16px;box-shadow:0 8px 28px rgba(67,160,71,.35);
}
.tv-slide-tech{font-size:44px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:16px;}
.tv-slide-tech-avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--green-deep));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0;box-shadow:0 8px 24px rgba(67,160,71,.3);}
.tv-slide-count{font-size:16px;color:var(--text-dim);font-weight:500;margin-left:4px;}

.tv-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:26px;}
.tv-jobs{overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:8px;}
.tv-job-card{
  background:linear-gradient(155deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  border:1px solid var(--glass-border);border-radius:18px;padding:20px 24px;
  border-left:4px solid var(--green);
}
.tv-job-time{font-size:22px;font-weight:800;color:var(--green-light);margin-bottom:6px;letter-spacing:-.3px;}
.tv-job-cust{font-size:24px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px;}
.tv-job-addr{font-size:15px;color:var(--text-dim);margin-bottom:8px;}
.tv-job-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tv-job-type{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:20px;background:rgba(67,160,71,.16);color:var(--green-light);}
.tv-job-id{font-size:12px;font-weight:700;letter-spacing:.3px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--text-dim);font-variant-numeric:tabular-nums;font-family:'SF Mono',Menlo,Consolas,monospace;}
.tv-job-notes{font-size:14px;color:var(--text-dim);margin-top:8px;line-height:1.5;font-style:italic;}
.tv-map{border-radius:20px;overflow:hidden;border:1px solid var(--glass-border);background:rgba(255,255,255,.03);min-height:0;position:relative;}
.tv-map iframe{width:100%;height:100%;border:0;filter:saturate(.85) brightness(.92);}
.tv-map-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dimmer);font-size:14px;}

.tv-empty-day{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-dimmer);}
.tv-empty-day-icon{font-size:56px;opacity:.4;}
.tv-empty-day-text{font-size:20px;}

/* Lead slide — same header language as the schedule slide, but a single-column
   body: the Gemini overview up top, latest email below. */
.tv-lead-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;overflow-y:auto;}
.ld-slide-overview{
  background:rgba(67,160,71,.12);border:1px solid rgba(67,160,71,.3);border-radius:20px;
  padding:22px 26px;font-size:20px;line-height:1.55;color:var(--text);font-weight:500;
}
.ld-slide-overview.loading{color:var(--text-dimmer);font-style:italic;font-weight:400;background:rgba(255,255,255,.04);border-color:var(--glass-border);}
.ld-slide-email{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:20px 24px;}
.ld-slide-email.flag{background:rgba(220,38,38,.14);border-color:rgba(220,38,38,.35);}
.ld-slide-email-meta{font-size:15px;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
.ld-slide-email.flag .ld-slide-email-meta{color:#fca5a5;}
.ld-slide-email-body{font-size:18px;color:var(--text);line-height:1.5;}

/* 'Both' mode — TV Mode only: schedule slide on top, lead slide below, each
   scaled down so the split never feels cramped. The mini card handles
   'both' differently (alternates full-size single slides) — see JS. */
.tv-split{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;}
.tv-split-pane{
  flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:rgba(255,255,255,.025);border:1px solid var(--glass-border);border-radius:22px;padding:18px 26px;
}

<script>

var TOOLS = [

function renderGrid(list) {

      + '<div class="card-foot"><span class="card-tag">'+t.tag+'</span><span class="card-arrow">→</span></div>'
      + '</a>';

function cardGlow(e) {
  var r = e.currentTarget.getBoundingClientRect();

}

// ── In-hub viewer: opens the tool in an embedded iframe with its own back button ──

// ══════════════════════════════════════════════════════════
// LIVE SCHEDULE — one shared slide engine, rendered at two sizes.
// A compact carousel is embedded right on the hub page, and "TV Mode" is
// the exact same live slide blown up full-screen for an office TV. They
// share one index/timer, so pausing or paging one does it to both — it's
// the same live view, just a different window size onto it.
// Pulls "who's going where" from a Supabase Edge Function that proxies
// Housecall Pro (see nageo-hub-schedule-function.ts for the backend code —
// a browser can't safely call HCP directly since that needs your API key).
// ══════════════════════════════════════════════════════════
var SCHEDULE_API_URL = "https://hpgwwegjsxyxovdattoc.supabase.co/functions/v1/quick-responder";
var SCHEDULE_ANON_KEY = "sb_publishable_D2PqYQoJjZ8koEM9NPvmeg_KB_Wa66H"; // sent as a Bearer token
var DEMO_SCHEDULE = false;  // set back to true any time to preview with sample data instead

// NAGeo Leads lives in the same Supabase project as the schedule function —
// same URL host, same anon key — so the hub can query its tables (leads,
// email_threads, email_messages) directly with supabase-js, exactly like
// the leads site itself does, no extra backend needed.
var SUPABASE_URL = "https://hpgwwegjsxyxovdattoc.supabase.co";
var sbClient = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SCHEDULE_ANON_KEY) : null;

function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// HCP sometimes returns a job's notes as an array of note objects instead of
// plain text — this flattens either shape into a display string so it never
// renders as the literal "[object Object]".
function notesText(n) {
  if (!n) return '';
  if (typeof n === 'string') return n;
  if (Array.isArray(n)) return n.map(notesText).filter(Boolean).join(' • ');
  if (typeof n === 'object') return n.content || n.text || n.note || n.body || '';
  return String(n);
}
function niceDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

var weekOffset = 0;

function startOfWeek(d) {
  var x = new Date(d);
  var day = x.getDay(); // 0=Sun
  var diff = day === 0 ? -6 : 1 - day; // Monday as start
  x.setDate(x.getDate() + diff);
  x.setHours(0,0,0,0);
  return x;
}
function fmtISO(d) { return d.toISOString().slice(0,10); }
function fmtDayLabel(d) { return d.toLocaleDateString('en-US',{weekday:'short'}); }
function fmtDateLabel(d) { return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function isSameDay(a,b) { return fmtISO(a) === fmtISO(b); }

function demoJobsFor(dateStr, idx) {
  // Sample data so the strip (and TV Mode) look right before the real endpoint is wired up.
  var pool = [
    [{jobId:"10482", time:"8:00 – 9:00 AM", customer:"Gary H. — Fairfax, VA", address:"11530 Valley Rd, Fairfax, VA 22033", tech:"Mike R.", type:"Service call", notes:"Annual maintenance check, WaterFurnace 7 Series."},
     {jobId:"10483", time:"10:30 – 11:30 AM", customer:"Reyes residence — Fairfax, VA", address:"4200 Legato Rd, Fairfax, VA 22033", tech:"Mike R.", type:"Repair", notes:"No heat call, check fault code."},
     {jobId:"10484", time:"1:00 – 2:30 PM", customer:"Bell residence — Fairfax, VA", address:"9990 Fairfax Blvd, Fairfax, VA 22030", tech:"Mike R.", type:"Service call", notes:"Filter + coil cleaning."}],
    [{jobId:"10491", time:"9:30 – 12:00 PM", customer:"Torres residence — Vienna, VA", address:"144 Maple Ave, Vienna, VA 22180", tech:"Dana P.", type:"Install", notes:"Loop field completion, day 2 of 3."},
     {jobId:"10492", time:"1:00 – 3:00 PM", customer:"Chen residence — Oakton, VA", address:"2946 Hunter Mill Rd, Oakton, VA 22124", tech:"Sam W.", type:"Repair", notes:"Compressor diagnostic."}],
    [],

     {jobId:"10504", time:"9:30 – 10:30 AM", customer:"Nguyen residence — Reston, VA", address:"1801 Reston Pkwy, Reston, VA 20190", tech:"Dana P.", type:"Service call", notes:"Thermostat replacement."}],
    [{jobId:"10510", time:"10:00 – 11:30 AM", customer:"Foster residence — McLean, VA", address:"1364 Beverly Rd, McLean, VA 22101", tech:"Sam W.", type:"Service call", notes:""}]
  ];
  return pool[idx % pool.length] || [];
}

async function fetchScheduleWeek(weekStartDate) {
  var start = fmtISO(weekStartDate);
  var endD = new Date(weekStartDate); endD.setDate(endD.getDate()+4); // Mon–Fri only, no weekend jobs
  var end = fmtISO(endD);
  if (DEMO_SCHEDULE || !SCHEDULE_API_URL) {
    var byDate = {};
    for (var i=0;i<5;i++){
      var d = new Date(weekStartDate); d.setDate(d.getDate()+i);
      byDate[fmtISO(d)] = demoJobsFor(fmtISO(d), i);
    }
    return byDate;
  }
  var res = await fetch(SCHEDULE_API_URL + '?start=' + start + '&end=' + end, {
    headers: SCHEDULE_ANON_KEY ? { 'Authorization': 'Bearer ' + SCHEDULE_ANON_KEY } : {}
  });
  if (!res.ok) throw new Error('Schedule fetch failed (' + res.status + ')');
  var data = await res.json();
  var grouped = {};
  (data.jobs || []).forEach(function(j) {
    if (!grouped[j.date]) grouped[j.date] = [];
    grouped[j.date].push(j);
  });
  return grouped;
}

// ══════════════════════════════════════════════════════════
// SHARED SLIDE ENGINE — one tech's day at a time, auto-advancing, with a
// keyless Google Maps route between that tech's stops. Rendered into
// whichever container(s) exist right now: the inline mini carousel,
// the full-screen TV Mode overlay, or both at once.
// ══════════════════════════════════════════════════════════
var TV_SLIDE_MS = 9000; // how long each slide stays up before auto-advancing
var tvSlides = [];
var tvIndex = 0;
var tvPlaying = true;
var tvAdvanceTimer = null;
var tvClockTimer = null;
var schedView = 'live'; // 'live' (carousel) or 'overview' (7-day-at-a-glance grid)
var currentByDate = null;
var currentWeekStart = null;

var contentMode = 'schedule'; // 'schedule' | 'leads' | 'both' — what the carousel + TV Mode show
var leadSlides = [];
var leadIndex = 0;
var leadsLoaded = false;
var bothPhase = 0; // alternates 0/1 in 'both' mode so the small mini card shows schedule, then leads, then schedule…

async function loadWeekSlides() {
  var weekStart = startOfWeek(new Date());
  weekStart.setDate(weekStart.getDate() + weekOffset*7);
  var weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+4); // Mon–Fri only, no weekend jobs
  document.getElementById('schedRange').textContent = fmtDateLabel(weekStart) + ' – ' + fmtDateLabel(weekEnd);

  setSlideContainers('<div class="tv-empty-day"><div class="tv-empty-day-icon">📡</div><div class="tv-empty-day-text">Loading schedule…</div></div>');
  document.getElementById('schedStrip').innerHTML = '<div class="sched-state">Loading schedule…</div>';
  var byDate;
  try {
    byDate = await fetchScheduleWeek(weekStart);
  } catch (err) {
    setSlideContainers('<div class="tv-empty-day"><div class="tv-empty-day-icon">⚠️</div><div class="tv-empty-day-text">Couldn\'t load the schedule.<br>(' + err.message + ')</div></div>');
    document.getElementById('schedStrip').innerHTML = '<div class="sched-state">Couldn\'t load the schedule.<br>(' + err.message + ')</div>';
    return;
  }
  currentByDate = byDate;
  currentWeekStart = weekStart;

  tvSlides = buildTVSlides(byDate, weekStart);
  tvIndex = 0;
  if (weekOffset === 0) {
    var idx = tvSlides.findIndex(function(s){ return s.isToday; });
    if (idx !== -1) tvIndex = idx;
  }
  renderProgressDots();
  renderCurrentSlide();
  if (tvPlaying) startTVAutoplay();
  renderOverview(); // keep the overview grid fresh in the background too, however it's toggled
}
function shiftWeek(delta) { weekOffset += delta; loadWeekSlides(); }
function jumpToToday() { weekOffset = 0; loadWeekSlides(); }
loadWeekSlides();
setInterval(function(){ if (weekOffset === 0) loadWeekSlides(); }, 5*60*1000); // refresh current week every 5 min

// setSlideContainers(html) writes the same markup into both displays (schedule-only
// or leads-only modes). setSlideContainers(miniHtml, tvHtml) writes different markup
// into each — used by 'both' mode, where the small mini card alternates between
// schedule/leads to stay uncluttered, while the roomier TV screen shows a real
// side-by-side split of both at once.
function setSlideContainers(miniHtml, tvHtml) {
  var mini = document.getElementById('miniSlideWrap');
  var tv = document.getElementById('tvSlideWrap');
  if (mini) mini.innerHTML = miniHtml;
  if (tv) tv.innerHTML = (tvHtml === undefined) ? miniHtml : tvHtml;
}

// ── View toggle: "Live" carousel vs. "Overview" 7-day grid ──
function setSchedView(v) {
  schedView = v;
  document.querySelectorAll('#schedViewToggle .sched-view-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.view === v); });
  document.getElementById('miniTvWrap').style.display = v === 'live' ? '' : 'none';
  document.getElementById('schedStrip').style.display = v === 'overview' ? '' : 'none';
  if (v === 'overview') renderOverview();
}

function renderOverview() {
  var strip = document.getElementById('schedStrip');
  if (!strip || !currentWeekStart || !currentByDate) return;
  var weekStart = currentWeekStart;
  var byDate = currentByDate;
  var today = new Date();
  var html = '';
  var todayIdx = -1;
  for (var i=0;i<5;i++) { // Mon–Fri only, no weekend jobs
    var d = new Date(weekStart); d.setDate(d.getDate()+i);
    var key = fmtISO(d);
    var jobs = byDate[key] || [];
    var today_ = isSameDay(d, today);
    if (today_) todayIdx = i;
    html += '<div class="sched-day' + (today_?' is-today':'') + '" id="schedDay'+i+'">';
    html += '<div class="sched-day-hdr"><div><div class="sched-day-name">' + (today_?'Today':fmtDayLabel(d)) + '</div><div class="sched-day-date">' + fmtDateLabel(d) + '</div></div>';
    html += '<div class="sched-day-count">' + jobs.length + '</div></div>';
    if (!jobs.length) {
      html += '<div class="sched-empty">No jobs scheduled</div>';
    } else {
      jobs.forEach(function(j) {
        html += '<div class="sched-job" onclick="this.classList.toggle(\'open\')">';
        html += '<div class="sched-job-time-row"><span class="sched-job-time">' + (j.time||'') + '</span>' + (j.jobId ? '<span class="sched-job-id">#'+j.jobId+'</span>' : '') + '</div>';
        html += '<div class="sched-job-cust">' + (j.customer||'') + '</div>';
        html += '<div class="sched-job-tech">👤 ' + (j.tech||'Unassigned') + '</div>';
        if (j.type || j.notes) {
          html += '<div class="sched-job-detail">';
          if (j.type) html += '<strong>' + esc(j.type) + '</strong><br>';
          if (j.notes) html += esc(notesText(j.notes));
          html += '</div>';
        }
        html += '</div>';
      });
    }
    html += '</div>';
  }
  strip.innerHTML = html;
  if (schedView === 'overview' && todayIdx !== -1) {
    var el = document.getElementById('schedDay'+todayIdx);
    if (el) el.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }
}

// ══════════════════════════════════════════════════════════
// LIVE LEADS — same Supabase project as the schedule (same URL, same anon
// key), so we query its tables directly, exactly like the leads site itself
// does client-side: active leads, needs-reply first then newest, each with
// its Gemini-written overview and latest email — no extra backend needed.
// ══════════════════════════════════════════════════════════
async function fetchLeadSlides() {
  if (!sbClient) throw new Error('Supabase client not available');
  var r = await sbClient.from('leads').select('*').eq('archived', false).neq('status', 'cold').order('created_at', { ascending: false });
  if (r.error) throw r.error;
  var leadsData = r.data || [];
  if (!leadsData.length) return [];

  var ids = leadsData.map(function(l){ return l.id; });
  var threadsByLead = {};
  var tRes = await sbClient.from('email_threads').select('*').in('lead_id', ids).order('last_message_at', { ascending: false });
  (tRes.data || []).forEach(function(t){ (threadsByLead[t.lead_id] = threadsByLead[t.lead_id] || []).push(t); });
  var threadIds = (tRes.data || []).map(function(t){ return t.id; });
  var messagesByThread = {};
  if (threadIds.length) {
    var mRes = await sbClient.from('email_messages').select('*').in('thread_id', threadIds).order('sent_at', { ascending: true });
    (mRes.data || []).forEach(function(m){ (messagesByThread[m.thread_id] = messagesByThread[m.thread_id] || []).push(m); });
  }

  function replyCount(id){ return (threadsByLead[id]||[]).filter(function(t){ return t.needs_reply; }).length; }
  leadsData.sort(function(a,b){
    var ar = replyCount(a.id) > 0 ? 1 : 0, br = replyCount(b.id) > 0 ? 1 : 0;
    if (ar !== br) return br - ar;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  return leadsData.map(function(l) {
    var threads = threadsByLead[l.id] || [];
    var latest = threads[0];
    var latestMsg = latest ? (messagesByThread[latest.id] || []).slice(-1)[0] : null;
    return {
      id: l.id,
      name: l.customer_name || 'Unknown',
      overview: l.ai_overview || '',
      overviewGeneratedAt: l.ai_overview_generated_at || null,
      latestActivityAt: latest ? latest.last_message_at : null,
      needsReply: !!(latest && latest.needs_reply),
      hasEmail: !!latest,
      latestMeta: latestMsg ? ((latestMsg.direction === 'inbound' ? 'Received from ' : 'Sent to ') + (latestMsg.direction === 'inbound' ? latestMsg.from_address : (latestMsg.to_addresses || [])[0] || '') + ' · ' + niceDate(latestMsg.sent_at)) : '',
      latestBody: latestMsg ? (latestMsg.ai_summary || latestMsg.snippet || '') : '',
      estimatesCount: (l.estimates || []).length
    };
  });
}

// Same Edge Function the leads site's "Review leads" mode calls to have
// Gemini write each lead's summary. The hub only *reads* ai_overview off the
// leads table above — nothing writes it until something asks Gemini to. So,
// just like the leads site does when you open its presentation mode, the hub
// asks this function to (re)generate the overview for any lead missing one
// or with newer email activity than its last summary, one at a time in the
// background, and patches the result in without interrupting the carousel.
var LEAD_HCP_SYNC_URL = SUPABASE_URL + "/functions/v1/lead-hcp-sync";
async function refreshStaleLeadOverviews() {
  var batch = leadSlides.slice();
  for (var i = 0; i < batch.length; i++) {
    var l = batch[i];
    var stale = !l.overview || (l.latestActivityAt && (!l.overviewGeneratedAt || new Date(l.latestActivityAt) > new Date(l.overviewGeneratedAt)));
    if (!stale) continue;
    try {
      var res = await fetch(LEAD_HCP_SYNC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SCHEDULE_ANON_KEY, 'apikey': SCHEDULE_ANON_KEY },
        body: JSON.stringify({ action: 'generate_overview', lead_id: l.id })
      });
      var data = await res.json();
      if (data && data.overview) {
        l.overview = data.overview;
        l.overviewGeneratedAt = new Date().toISOString();
        // Only re-render if this lead is still the one on screen right now —
        // leadSlides may have been replaced by a newer fetch by the time this lands.
        if (leadSlides[leadIndex] === l && (contentMode === 'leads' || contentMode === 'both')) renderCurrentSlide();
      } else {
        console.warn('[leads] overview regen failed for', l.name, data && data.error);
      }
    } catch (e) {
      console.warn('[leads] overview regen failed for', l.name, e);
    }
  }
}

async function loadLeadSlides() {
  try {
    leadSlides = await fetchLeadSlides();
  } catch (err) {
    console.warn('[leads] fetch failed', err);
    leadSlides = [];
  }
  leadsLoaded = true;
  if (leadIndex >= leadSlides.length) leadIndex = 0;
  if (contentMode === 'leads' || contentMode === 'both') {
    renderProgressDots();
    renderCurrentSlide();
    if (tvPlaying) startTVAutoplay();
  }
  refreshStaleLeadOverviews(); // fire and forget — patches summaries in as Gemini returns them
}
loadLeadSlides();
setInterval(loadLeadSlides, 5*60*1000); // refresh leads every 5 min, same cadence as the schedule

function leadEmptyHtml() {
  return leadsLoaded
    ? '<div class="tv-empty-day"><div class="tv-empty-day-icon">🎯</div><div class="tv-empty-day-text">No active leads right now.</div></div>'
    : '<div class="tv-empty-day"><div class="tv-empty-day-icon">📡</div><div class="tv-empty-day-text">Loading leads…</div></div>';
}

function initials(name) {
  return (name||'').split(' ').map(function(w){ return w[0]||''; }).join('').toUpperCase().slice(0,2) || '?';
}
function mapEmbedUrl(stops) {
  var clean = (stops||[]).filter(Boolean);
  if (!clean.length) return null;
  if (clean.length === 1) return 'https://www.google.com/maps?q=' + encodeURIComponent(clean[0]) + '&output=embed';
  var origin = encodeURIComponent(clean[0]);
  var rest = clean.slice(1).map(encodeURIComponent).join('+to:');
  return 'https://www.google.com/maps?saddr=' + origin + '&daddr=' + rest + '&output=embed';
}

function buildTVSlides(byDate, weekStart) {
  var slides = [];
  var today = new Date();
  for (var i=0;i<5;i++) { // Mon–Fri only, no weekend jobs
    var d = new Date(weekStart); d.setDate(d.getDate()+i);
    var key = fmtISO(d);
    var jobs = byDate[key] || [];
    var dayMeta = { dayLabel: isSameDay(d,today) ? 'Today' : fmtDayLabel(d), dateLabel: fmtDateLabel(d), isToday: isSameDay(d,today) };
    if (!jobs.length) {
      slides.push(Object.assign({ empty:true }, dayMeta));
      continue;
    }
    var techOrder = [];
    var byTech = {};
    jobs.forEach(function(j) {
      var t = j.tech || 'Unassigned';
      if (!byTech[t]) { byTech[t] = []; techOrder.push(t); }
      byTech[t].push(j);
    });
    techOrder.forEach(function(t) {
      slides.push(Object.assign({ tech:t, jobs: byTech[t], stops: byTech[t].map(function(j){return j.address;}) }, dayMeta));
    });
  }
  return slides;
}

function openTVMode() {
  document.getElementById('tv').classList.add('open');
  renderCurrentSlide(); // TV Mode just displays whatever slide the mini carousel is already on
  if (!tvClockTimer) { updateTVClock(); tvClockTimer = setInterval(updateTVClock, 15000); }
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function(){}); } catch(e){}
}
function closeTVMode() {
  document.getElementById('tv').classList.remove('open');
  if (tvClockTimer) { clearInterval(tvClockTimer); tvClockTimer = null; }
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch(e){} }
  // autoplay keeps running in the background — the mini carousel stays live
}
function updateTVClock() {
  var el = document.getElementById('tvClock');
  if (el) el.textContent = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function dotsHtml(prefix, count) {
  var out = '';
  for (var i=0;i<count;i++) out += '<div class="tv-dot" id="'+prefix+'Dot'+i+'"><div class="tv-dot-fill"></div></div>';
  return out;
}
// 'both' mode hides the per-slide dots — with two independent sequences plus
// an alternating mini card, per-dot progress stops meaning anything useful
// and just adds clutter, so we leave that row empty in that mode.
function renderProgressDots() {
  var mini = document.getElementById('miniProgress');
  var tv = document.getElementById('tvProgress');
  if (contentMode === 'both') { if (mini) mini.innerHTML = ''; if (tv) tv.innerHTML = ''; return; }
  var count = contentMode === 'schedule' ? tvSlides.length : leadSlides.length;
  if (mini) mini.innerHTML = dotsHtml('mini', count);
  if (tv) tv.innerHTML = dotsHtml('tv', count);
}
function updateProgressState() {
  if (contentMode === 'both') return;
  var count = contentMode === 'schedule' ? tvSlides.length : leadSlides.length;
  var idx = contentMode === 'schedule' ? tvIndex : leadIndex;
  ['mini','tv'].forEach(function(prefix) {
    for (var i=0;i<count;i++) {
      var dot = document.getElementById(prefix+'Dot'+i);
      if (!dot) continue;
      dot.classList.remove('done','active');
      var fill = dot.querySelector('.tv-dot-fill');
      fill.style.transition = 'none';
      if (i < idx) { dot.classList.add('done'); fill.style.width = '100%'; }
      else if (i === idx) { dot.classList.add('active'); fill.style.width = '0%'; }
      else { fill.style.width = '0%'; }
    }
  });
}

function slideContentHtml(s) {
  var html = '<div class="tv-slide-hdr"><div class="tv-slide-day">' + s.dayLabel + ' · ' + s.dateLabel + '</div>';
  if (s.empty) {
    html += '</div><div class="tv-empty-day"><div class="tv-empty-day-icon">☕</div><div class="tv-empty-day-text">No jobs scheduled ' + s.dayLabel.toLowerCase() + '.</div></div>';
    return html;
  }
  html += '<div class="tv-slide-tech"><div class="tv-slide-tech-avatar">' + initials(s.tech) + '</div>' + s.tech + '<span class="tv-slide-count">' + s.jobs.length + ' stop' + (s.jobs.length!==1?'s':'') + ' today</span></div></div>';
  html += '<div class="tv-body"><div class="tv-jobs">';
  s.jobs.forEach(function(j) {
    html += '<div class="tv-job-card">';
    html += '<div class="tv-job-time">' + (j.time||'') + '</div>';
    html += '<div class="tv-job-cust">' + (j.customer||'') + '</div>';
    if (j.address) html += '<div class="tv-job-addr">📍 ' + j.address + '</div>';
    html += '<div class="tv-job-meta">' + (j.jobId ? '<span class="tv-job-id">#'+j.jobId+'</span>' : '') + (j.type ? '<span class="tv-job-type">'+esc(j.type)+'</span>' : '') + '</div>';
    if (j.notes) html += '<div class="tv-job-notes">' + esc(notesText(j.notes)) + '</div>';
    html += '</div>';
  });
  html += '</div><div class="tv-map">';
  var mapUrl = mapEmbedUrl(s.stops);
  html += mapUrl
    ? '<iframe src="'+mapUrl+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>'
    : '<div class="tv-map-empty">No addresses to map</div>';
  html += '</div></div>';
  return html;
}

// Lead slide — same "big blocks" language as the schedule slide (tv-slide-hdr /
// tv-slide-tech / etc.) so it feels like the same system, but the body is the
// Gemini overview + latest email from the leads site's own "Review leads" mode,
// reskinned to the hub's navy/green look instead of that site's warm palette.
function leadSlideContentHtml(l) {
  var badge = l.needsReply ? 'NEEDS A REPLY' : 'ACTIVE LEAD';
  var html = '<div class="tv-slide-hdr"><div class="tv-slide-day">' + badge + '</div>';
  html += '<div class="tv-slide-tech"><div class="tv-slide-tech-avatar">' + initials(l.name) + '</div>' + esc(l.name)
    + (l.estimatesCount ? '<span class="tv-slide-count">' + l.estimatesCount + ' estimate' + (l.estimatesCount!==1?'s':'') + '</span>' : '')
    + '</div></div>';
  html += '<div class="tv-lead-body">';
  html += '<div class="ld-slide-overview' + (l.overview ? '' : ' loading') + '">' + esc(l.overview || 'Preparing summary…') + '</div>';
  html += '<div class="ld-slide-email' + (l.needsReply ? ' flag' : '') + '">';
  if (l.hasEmail) {
    html += '<div class="ld-slide-email-meta">' + esc(l.latestMeta) + (l.needsReply ? ' — not replied to yet' : '') + '</div>';
    html += '<div class="ld-slide-email-body">' + esc(l.latestBody || '(no summary)') + '</div>';
  } else {
    html += '<div class="ld-slide-email-meta">No email history yet</div>';
  }
  html += '</div></div>';
  return html;
}

// 'both' mode: TV Mode has room to show a real side-by-side split of the
// current schedule slide and the current lead slide at once. The small mini
// card does not — see setSlideContainers/renderCurrentSlide for how it
// alternates between the two instead, so the page never feels cramped.
function splitContentHtml() {
  var schedHtml = tvSlides.length ? slideContentHtml(tvSlides[tvIndex]) : '<div class="tv-empty-day"><div class="tv-empty-day-icon">🗓️</div><div class="tv-empty-day-text">No jobs scheduled this week.</div></div>';
  var leadHtml = leadSlides.length ? leadSlideContentHtml(leadSlides[leadIndex]) : leadEmptyHtml();
  return '<div class="tv-split">'
    + '<div class="tv-split-pane"><div class="tv-split-label">📅 Schedule</div>' + schedHtml + '</div>'
    + '<div class="tv-split-pane"><div class="tv-split-label">🎯 Leads</div>' + leadHtml + '</div>'
    + '</div>';
}

function renderCurrentSlide() {
  var topDay = document.getElementById('tvTopDay');

  if (contentMode === 'schedule') {
    if (!tvSlides.length) {
      setSlideContainers('<div class="tv-empty-day"><div class="tv-empty-day-icon">🗓️</div><div class="tv-empty-day-text">No jobs scheduled this week.</div></div>');
      if (topDay) topDay.textContent = '—';
    } else {
      var s = tvSlides[tvIndex];
      if (topDay) topDay.textContent = s.dayLabel + ' · ' + s.dateLabel;
      setSlideContainers(slideContentHtml(s));
    }
  } else if (contentMode === 'leads') {
    if (!leadSlides.length) {
      setSlideContainers(leadEmptyHtml());
      if (topDay) topDay.textContent = 'LEADS';
    } else {
      var l = leadSlides[leadIndex];
      if (topDay) topDay.textContent = 'LEAD ' + (leadIndex+1) + ' / ' + leadSlides.length;
      setSlideContainers(leadSlideContentHtml(l));
    }
  } else { // both
    if (topDay) topDay.textContent = 'SCHEDULE + LEADS';
    var miniHtml = bothPhase === 0
      ? (tvSlides.length ? slideContentHtml(tvSlides[tvIndex]) : '<div class="tv-empty-day"><div class="tv-empty-day-icon">🗓️</div><div class="tv-empty-day-text">No jobs scheduled this week.</div></div>')
      : (leadSlides.length ? leadSlideContentHtml(leadSlides[leadIndex]) : leadEmptyHtml());
    setSlideContainers(miniHtml, splitContentHtml());
  }

  updateProgressState();
  if (contentMode === 'both') return;
  requestAnimationFrame(function() {
    var idx = contentMode === 'schedule' ? tvIndex : leadIndex;
    ['mini','tv'].forEach(function(prefix) {
      var fill = document.querySelector('#'+prefix+'Dot'+idx+' .tv-dot-fill');
      if (fill && tvPlaying) { fill.style.transition = 'width ' + TV_SLIDE_MS + 'ms linear'; fill.style.width = '100%'; }
    });
  });
}

// Advances whichever index(es) matter for the current mode. In 'both' mode
// both the schedule and lead pointers move every tick (that's what drives
// the TV split view), and bothPhase flips too (that's what the mini card
// uses to decide which of the two it's currently showing).
function advanceIndices(dir) {
  if ((contentMode === 'schedule' || contentMode === 'both') && tvSlides.length) {
    tvIndex = (tvIndex + dir + tvSlides.length) % tvSlides.length;
  }
  if ((contentMode === 'leads' || contentMode === 'both') && leadSlides.length) {
    leadIndex = (leadIndex + dir + leadSlides.length) % leadSlides.length;
  }
  if (contentMode === 'both') bothPhase = 1 - bothPhase;
}

function slideNext() { advanceIndices(1); renderCurrentSlide(); if (tvPlaying) startTVAutoplay(); }
function slidePrev() { advanceIndices(-1); renderCurrentSlide(); if (tvPlaying) startTVAutoplay(); }
function startTVAutoplay() {
  stopTVAutoplay();
  tvAdvanceTimer = setInterval(function() { advanceIndices(1); renderCurrentSlide(); }, TV_SLIDE_MS);
}
function stopTVAutoplay() { if (tvAdvanceTimer) { clearInterval(tvAdvanceTimer); tvAdvanceTimer = null; } }
function slideTogglePlay() {
  tvPlaying = !tvPlaying;
  var icon = tvPlaying ? '⏸' : '▶';
  var miniBtn = document.getElementById('miniPlayBtn'); if (miniBtn) miniBtn.textContent = icon;
  var tvBtn = document.getElementById('tvPlayBtn'); if (tvBtn) tvBtn.textContent = icon;
  var miniArrows = document.getElementById('miniArrows'); if (miniArrows) miniArrows.classList.toggle('show', !tvPlaying);
  var tvArrows = document.getElementById('tvArrows'); if (tvArrows) tvArrows.classList.toggle('show', !tvPlaying);
  if (tvPlaying) { startTVAutoplay(); renderCurrentSlide(); } else { stopTVAutoplay(); updateProgressState(); }
}
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('tv').classList.contains('open')) return;
  if (e.key === 'Escape') closeTVMode();
  else if (e.key === ' ') { e.preventDefault(); slideTogglePlay(); }
  else if (e.key === 'ArrowRight' && !tvPlaying) slideNext();
  else if (e.key === 'ArrowLeft' && !tvPlaying) slidePrev();
});

// ── Content mode: what the carousel (mini + TV) shows ──
function setContentMode(mode) {
  contentMode = mode;
  document.querySelectorAll('.content-mode-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode === mode); });
  var viewToggle = document.getElementById('schedViewToggle');
  var range = document.getElementById('schedRange');
  var todayBtn = document.getElementById('schedTodayBtn');
  var nav = document.getElementById('schedNav');
  if (mode === 'schedule') {
    if (viewToggle) viewToggle.style.display = '';
    if (range) range.style.display = '';
    if (todayBtn) todayBtn.style.display = '';
    if (nav) nav.style.display = '';
  } else {
    if (viewToggle) viewToggle.style.display = 'none';
    if (schedView !== 'live') setSchedView('live'); // the weekly grid only applies to schedule mode
    var leadsOnly = mode === 'leads';
    if (range) range.style.display = leadsOnly ? 'none' : '';
    if (todayBtn) todayBtn.style.display = leadsOnly ? 'none' : '';
    if (nav) nav.style.display = leadsOnly ? 'none' : '';
  }
  renderProgressDots();
  renderCurrentSlide();
  if (tvPlaying) startTVAutoplay();
}

function updateClock() {
  var now = new Date();
  var h = now.getHours();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  document.getElementById('clockDate').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').innerHTML = greet + ', <span>team</span>.';
}
updateClock();
setInterval(updateClock, 30000);
